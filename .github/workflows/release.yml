name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the leading v (for example 1.0.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/agentifiers/firecrawl
  TABLE_DEFINITION: apps/api/src/services/dynamo/dynamodb-table.json
  VERSION: ${{ inputs.version }}

jobs:
  image:
    name: Build and publish linux/arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Refuse an invalid or existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be semantic (for example 1.0.0), received '${VERSION}'"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --silent 2>/dev/null; then
            echo "::error::tag v${VERSION} already exists"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=firecrawl
            org.opencontainers.image.description=Self-hosted Firecrawl API server on DynamoDB (modified fork)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Tag and publish the GitHub Release
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create tag and release
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creating the ref fails when the tag already exists, so a concurrent
          # or repeated dispatch cannot move it.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/v${VERSION}" -f "sha=${GITHUB_SHA}" --silent
          cat > "${RUNNER_TEMP}/notes.md" <<EOF
          Image: \`${IMAGE}:${VERSION}@${DIGEST}\`

          Commit: \`${GITHUB_SHA}\` (also tagged \`${IMAGE}:${GITHUB_SHA}\`).

          \`dynamodb-table.json\` is the DynamoDB table definition this image
          requires; the image ships the same file at \`/app/dynamodb-table.json\`.
          EOF
          gh release create "v${VERSION}" "${TABLE_DEFINITION}" \
            --verify-tag --title "v${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
